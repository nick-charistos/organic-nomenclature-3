<!DOCTYPE html>
<html lang="en">

<head>

    <script src="JSmol.min.js"> </script>
    <script src="snap/snap.svg-min.js"></script>

    <script>
        var JSmol_Applet = {
            width: "100%",
            height: "100%",
        }
    </script>

    <style>
        #jsmeNomeclatureSVG {
            width: 400px;
            height: 200px;
        }

        .svgAtomLabel {

<body>

    <div class="panelContainer">
        <div class="HFlex">
            <!-- left column: MENU -->
            <div class="VFlex">
                <div id="nomeclatureMenu" style="min-width: 200px;margin-right: 10px;"> </div>
                
            </div>

            <!-- middle column -->
            <div class="VFlex">
                <div id="molName" class="infoMolName"
                    style="border: 1px solid #219EBC; border-bottom: 0;margin:0;padding-top:10px;"></div>
                  
                <!--JSME 2D -->
                <div id="jsmeNomeclatureDIV" style="border: 1px solid #219EBC; border-top: 0; border-bottom: 0;">
                    <div id="jsmeNomeclature" class="hide"></div>
                    <div id="jsmeNomeclatureSVG"></div>
                </div>


                <div id="nomeclature3D" class="JmolContainer" style="border: 1px solid #219EBC; border-top:0; ">

                        jmolAppletNomeclature = Jmol.getApplet("jmolAppletNomeclature", JSmol_Applet);
                    </script>
                </div>

            </div>

            <!-- right column -->
            <div class="VFlex" style="margin-left:10px;justify-content: space-between;">

                <div id="nameAnalysisContainer"></div>
                
                <div class="VFlex" style="">
                    <div id="radio2DMode" class="">
                        <div class='radioGroupContainer VFlex ' style=''>

                            <div class='radioCheckContainer unselectedRadio '>Ανεπτυγμένος Συντακτικός Τύπος<span
                                    class='radioCheck'></span></div>
                        </div>


                    </div>

                    <div id="atomSymbolsCheck" class="checkBoxContainer selectedCheck">Σύμβολα Ατόμων
                        (3D)<span class="checkBox"></span>
                    </div>

                </div>
              
            </div>
            
        </div>
        
    </div>
    <textarea  id="debugSVG" rows="10" cols="120"></textarea >
