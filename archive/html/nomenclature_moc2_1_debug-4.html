<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ονοματολογία Οργανικών Ενώσεων 2</title>

    <link rel="stylesheet" href="css/jsme-nick-3.css">

    <script src="jsme/jsme.nocache.js"></script>
    <script src="jquery/jquery-3.7.1.min.js"></script>
    <script src="JSmol.min.js"> </script>
    <script src="snap/snap.svg-min.js"></script>

    <script>
        var JSmol_Applet = {
            width: "100%",
            height: "100%",
            color: "#ffffff"
        }
    </script>

    <style>
        #jsmeNomeclatureSVG {
            width: 450px;
            height: 200px;
        }

        

      </style>


</head>

<body>

    <div class="panelContainer" style="max-width: 1200px;">
        <div class="HFlex" style="justify-content: center;">
            <!-- left column: MENU -->
            <div class="VFlex" style="margin-right: 20px;">
                <div id="nomeclatureMenu" style="min-width: 240px;;font-size: 1.125rem;"> </div>

            </div>

            <!-- middle column -->
            <div class="VFlex" style="background-color: #fff;">
                <div class='panelTitle'> Μόριο </div>
                <div id="molName" class="infoMolName"
                    style="border: 1px solid var(--baseColor); border-bottom: 0;margin:0;padding-top:10px;height: 35px;box-sizing: border-box;">
                </div>

                <!--JSME 2D -->
                <div id="jsmeNomeclatureDIV" style="border: 1px solid var(--baseColor); border-top: 0; border-bottom: 0;">
                    <div id="jsmeNomeclature" class="hide"></div>
                    <div id="jsmeNomeclatureSVG"></div>
                </div>
                <div id="radio2DMode" style="border: 1px solid var(--baseColor); border-top: 0; border-bottom: 0;">
                    <div class='radioGroupContainer HFlex ' style='justify-content: center;'>
                        <div class='radioCheckContainer selectedRadio'>Συνεπτυγμένος<span
                                class='radioCheck'></span></div>
                                <div class='radioCheckContainer unselectedRadio'>Ανεπτυγμένος<span
                                    class='radioCheck'></span></div>
                        <div class='radioCheckContainer unselectedRadio '>Διαγραμματικός<span
                                class='radioCheck'></span></div>
                    </div>
                </div>

                <div id="nomeclature3D" class="JmolContainer"
                    style="width:450px;border: 1px solid var(--baseColor); border-top:0; border-bottom:0; ">
                    <script>
                        jmolAppletNomeclature = Jmol.getApplet("jmolAppletNomeclature", JSmol_Applet);
                        Jmol.script(jmolAppletNomeclature, "frank off")
                    </script>
                </div>
                <div class="HFlex" style="border: 1px solid var(--baseColor); border-top:0; justify-content: center; ">

                    <div id="atomSymbolsCheck" class="checkBoxContainer selectedCheck">Σύμβολα Ατόμων <span
                            class="checkBox"></span>
                    </div>
                    <div id="rotateCheck" class="checkBoxContainer unselectedCheck">Περιστροφή <span
                        class="checkBox"></span>
                </div>
                <div id="dropMenu" style=" margin-top: 2px;"></div>

                </div>
            </div>

            <!-- right column -->
            <div class="VFlex" style="margin-left:20px;justify-content: space-between;width: 350px;">
                <div>
                    <div id="nameAnalysisContainer"></div>
                    <div id="nameAnalysisExplain"></div>
                    <div id="ruleTheoryContainer"></div>
                </div>


            </div>

            <!-- debug -->
            <div id="debug" style="max-height: 600px; overflow: auto;"></div>

        </div>

    </div>

    <div id="creditsLib"></div>
    <div id="creditsUs"></div>


    <!-- <textarea  id="debugSVG" rows="10" cols="120"></textarea > -->



    <script src="js/jsme-nick-nomeclature-moc2-data_3.js"></script>
    <script src="js/jsme-nick-nomeclature-moc2-4.js"></script>
    <script src="jsme/96E40B969193BD74B8A621486920E79C.cache.js"></script>

</body>

</html>
